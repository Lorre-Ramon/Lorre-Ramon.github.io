<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxuan Shi — Résumé</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='monospace'>▮</text></svg>">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
/* Print-first résumé. Rendered from the same content/site.<lang>.json the site
   uses, so it cannot drift — and it carries no phone number by construction. */
body { background: #fff; color: #1d1d1f; }
.sheet {
  max-width: 760px; margin: 0 auto; padding: 48px 40px 72px;
  font-size: 14px; line-height: 1.5;
}
.r-head { border-bottom: 1px solid var(--hairline); padding-bottom: 16px; margin-bottom: 22px; }
.r-name { font-family: var(--font-display); font-size: 30px; font-weight: 600;
          letter-spacing: -0.01em; margin-bottom: 6px; }
.r-contact { font-size: 12.5px; color: var(--text-secondary); }
.r-contact a { color: var(--text-secondary); text-decoration: underline; }
.r-sec { margin-bottom: 22px; }
.r-sec > h2 {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-tertiary); font-weight: 600;
  border-bottom: 1px solid var(--hairline); padding-bottom: 5px; margin-bottom: 12px;
}
.r-item { margin-bottom: 14px; break-inside: avoid; }
.r-row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.r-org { font-weight: 600; font-size: 14.5px; }
.r-when { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
.r-role { color: var(--text-secondary); font-size: 13px; margin-bottom: 5px; }
.r-item ul { margin: 4px 0 0; padding: 0; }
.r-item li { position: relative; padding-left: 14px; margin-bottom: 4px; }
.r-item li::before { content: "·"; position: absolute; left: 3px; }
.r-skill { margin-bottom: 5px; }
.r-skill b { font-weight: 600; }
.r-tools {
  display: flex; gap: 10px; justify-content: center;
  padding: 16px 0 0; border-top: 1px solid var(--hairline); margin-top: 8px;
}
@media print {
  .r-tools { display: none; }
  .sheet { padding: 0; max-width: none; font-size: 10.5pt; }
  @page { margin: 14mm; }
}
</style>
</head>
<body>
<div class="sheet">
  <div class="r-head">
    <div class="r-name" id="r-name"></div>
    <div class="r-contact" id="r-contact"></div>
  </div>
  <div id="r-body"></div>
  <div class="r-tools">
    <button class="btn btn--secondary" id="r-lang" type="button">中文</button>
    <button class="btn btn--primary" id="r-print" type="button">Print / Save as PDF</button>
    <a class="btn btn--secondary" href="/">Back to site</a>
  </div>
</div>

<script type="module">
import { initLang, getLang, setLang, loadContent, onLangChange } from '/assets/js/i18n.js';

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function section(title, items) {
  const s = el('section', 'r-sec');
  s.appendChild(el('h2', null, title));
  items.forEach((i) => s.appendChild(i));
  return s;
}

function item({ org, when, role, points }) {
  const box = el('div', 'r-item');
  const row = el('div', 'r-row');
  row.append(el('span', 'r-org', org), el('span', 'r-when', when));
  box.appendChild(row);
  if (role) box.appendChild(el('div', 'r-role', role));
  if (points?.length) {
    const ul = el('ul');
    points.forEach((p) => ul.appendChild(el('li', null, p)));
    box.appendChild(ul);
  }
  return box;
}

const L = {
  en: { edu: 'Education', exp: 'Professional Experience', proj: 'Projects',
        res: 'Research', skills: 'Skills', print: 'Print / Save as PDF', other: '中文' },
  zh: { edu: '教育背景', exp: '实习经历', proj: '项目经历',
        res: '研究经历', skills: '技能', print: '打印 / 存为 PDF', other: 'EN' },
};

async function render(lang) {
  const c = await loadContent(lang);
  const p = c.profile ?? {};
  const s = L[lang];

  document.getElementById('r-name').textContent = p.name;

  const contact = document.getElementById('r-contact');
  contact.textContent = '';
  // Email and public profiles only — no phone number on a crawlable page.
  const mail = el('a', null, p.email); mail.href = `mailto:${p.email}`;
  contact.append(p.location ?? '', ' · ', mail);
  (p.links ?? []).filter((l) => !l.url.startsWith('mailto:')).forEach((l) => {
    const a = el('a', null, l.label); a.href = l.url; a.rel = 'noopener';
    contact.append(' · ', a);
  });

  const body = document.getElementById('r-body');
  body.textContent = '';

  body.appendChild(section(s.edu, (c.education ?? []).map((e) => item({
    org: e.school, when: e.date, role: `${e.degree}${e.detail ? ` · ${e.detail}` : ''}`,
    points: e.coursework?.length ? [`${lang === 'zh' ? '课程' : 'Coursework'}: ${e.coursework.join(', ')}`] : [],
  }))));

  body.appendChild(section(s.exp, (c.experience ?? []).map((j) => item({
    org: `${j.company}${j.team ? ` — ${j.team}` : ''}${j.location ? `, ${j.location}` : ''}`,
    when: j.date, role: j.role, points: j.highlights,
  }))));

  body.appendChild(section(s.proj, (c.projects ?? []).map((x) => item({
    org: `${x.name}${x.subtitle ? ` — ${x.subtitle}` : ''}`,
    when: x.date, role: [x.role, x.url].filter(Boolean).join(' · '), points: x.highlights,
  }))));

  body.appendChild(section(s.res, (c.research ?? []).map((r) => item({
    org: r.title, when: r.date,
    role: [r.role, r.advisor].filter(Boolean).join(' · '), points: r.highlights,
  }))));

  const skills = el('div');
  (c.skills ?? []).forEach((g) => {
    const line = el('div', 'r-skill');
    line.append(el('b', null, `${g.group}: `), document.createTextNode(g.items.join(', ')));
    skills.appendChild(line);
  });
  body.appendChild(section(s.skills, [skills]));

  document.getElementById('r-lang').textContent = s.other;
  document.getElementById('r-print').textContent = s.print;
  document.title = `${p.name} — ${lang === 'zh' ? '简历' : 'Résumé'}`;
}

const lang = initLang();
render(lang);
onLangChange((l) => render(l));
document.getElementById('r-lang').addEventListener('click',
  () => setLang(getLang() === 'en' ? 'zh' : 'en'));
document.getElementById('r-print').addEventListener('click', () => window.print());
</script>
</body>
</html>
